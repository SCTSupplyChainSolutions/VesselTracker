<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCT Vessel Tracker</title>
  <script type="text/javascript">
    function isValidIMO(imo) {
      if (typeof imo !== "string") return false;
      const trimmed = imo.trim().toLowerCase();
      return trimmed !== "" && trimmed !== "null" && trimmed !== "undefined";
    }
    window.onload = function () {
      const urlParams = new URLSearchParams(window.location.search);
      const imo = urlParams.get("imo");
      const iframe = document.getElementById("vesselMap");
      const container = document.querySelector(".iframe-container");

      // VesselFinder's aismap endpoint requires width/height/names to be
      // present in the query string or it returns "Bad request" - it does
      // not just rely on the iframe tag's own width/height/CSS.
      const w = Math.max(Math.round(container.clientWidth), 1) || 800;
      const h = Math.max(Math.round(container.clientHeight), 1) || 600;

      const params = new URLSearchParams();
      params.set("width", w);
      params.set("height", h);
      params.set("names", "true");

      if (isValidIMO(imo)) {
        params.set("imo", imo.trim());
        params.set("zoom", "9");
        params.set("track", "true");
      } else {
        // Center over South Africa as fallback
        params.set("lat", "-29");
        params.set("lon", "22.9375");
        params.set("zoom", "5");
      }

      iframe.src = "https://www.vesselfinder.com/aismap?" + params.toString();
      iframe.style.display = "block";
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Montserrat", sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden; /* prevent scrollbars */
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Top white bar containing text and logo */
    .top-bar {
      width: 100%;
      background-color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      box-sizing: border-box;
      z-index: 10;
      flex-shrink: 0;
      border-bottom: 1px solid #ccc;
    }
    .top-bar .text-container {
      display: flex;
      flex-direction: column;
    }
    .instructions {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin: 0 0 10px 0;
    }
    .additionalInfo {
      font-size: 14px;
      font-weight: 400;
      color: #666;
      margin: 0;
    }
    .logoBox img {
      width: 125px;
      height: auto;
    }
    .iframe-container {
      flex: 1; /* fill remaining viewport */
      width: 100%;
      position: relative;
    }
    #vesselMap {
      width: 100%;
      height: 100%;
      border: none;
    }
    @media (max-width: 768px) {
      .instructions { font-size: 14px; }
      .additionalInfo { font-size: 12px; }
      .logoBox img { width: 100px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="text-container">
      <p class="instructions">Search by Client Reference to Track Vessel</p>
      <p class="additionalInfo">If Vessel not within Terrestrial AIS Range, tracking may be outdated, in which case search for vessel (IMO) on Marine Traffic</p>
    </div>
    <div class="logoBox">
      <img src="https://github.com/SCTSupplyChainSolutions/VesselTracker/blob/main/SCT%20Logo.jpg?raw=true" alt="SCT Logo" />
    </div>
  </div>
  <div class="iframe-container">
    <iframe id="vesselMap" frameborder="0"></iframe>
  </div>
</body>
</html>
