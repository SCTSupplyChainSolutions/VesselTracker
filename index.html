<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCT Vessel Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Montserrat", sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden; /* prevent scrollbars */
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Top white bar containing text and logo */
    .top-bar {
      width: 100%;
      background-color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      box-sizing: border-box;
      z-index: 10;
      flex-shrink: 0;
      border-bottom: 1px solid #ccc;
    }
    .top-bar .text-container {
      display: flex;
      flex-direction: column;
    }
    .instructions {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin: 0 0 10px 0;
    }
    .additionalInfo {
      font-size: 14px;
      font-weight: 400;
      color: #666;
      margin: 0;
    }
    .logoBox img {
      width: 125px;
      height: auto;
    }
    .iframe-container {
      flex: 1; /* fill remaining viewport */
      width: 100%;
      position: relative;
    }
    /* aismap.js writes its own iframe here - stretch it to fill this box */
    .iframe-container iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }
    @media (max-width: 768px) {
      .instructions { font-size: 14px; }
      .additionalInfo { font-size: 12px; }
      .logoBox img { width: 100px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="text-container">
      <p class="instructions">Search by Client Reference to Track Vessel</p>
      <p class="additionalInfo">If Vessel not within Terrestrial AIS Range, tracking may be outdated, in which case search for vessel (IMO) on Marine Traffic</p>
    </div>
    <div class="logoBox">
      <img src="https://github.com/SCTSupplyChainSolutions/VesselTracker/blob/main/SCT%20Logo.jpg?raw=true" alt="SCT Logo" />
    </div>
  </div>
  <div class="iframe-container" id="vesselMapContainer">
    <script type="text/javascript">
      // VesselFinder only supports embedding via their own aismap.js loader
      // (see https://www.vesselfinder.com/embed) - it reads these globals
      // and injects its own iframe with the internal parameters (fleet,
      // store_pos, ra, etc.) that the aismap endpoint requires. Hand-building
      // the iframe src ourselves omits those and the endpoint returns
      // "Bad request" (HTTP 400).
      function isValidIMO(imo) {
        if (typeof imo !== "string") return false;
        var trimmed = imo.trim().toLowerCase();
        return trimmed !== "" && trimmed !== "null" && trimmed !== "undefined";
      }

      var urlParams = new URLSearchParams(window.location.search);
      var imoParam = urlParams.get("imo");

      // .top-bar is already in the DOM at this point (it's earlier in the
      // document), so its rendered height can be measured now to size the
      // map for the remaining viewport space.
      var topBar = document.querySelector(".top-bar");
      var availableHeight = window.innerHeight - (topBar ? topBar.offsetHeight : 90);
      if (!availableHeight || availableHeight < 200) availableHeight = 400;

      window.width = "100%";
      window.height = String(Math.round(availableHeight));
      window.names = true;

      if (isValidIMO(imoParam)) {
        window.imo = imoParam.trim();
        window.show_track = true;
      } else {
        // Center over South Africa as fallback
        window.latitude = "-29.00";
        window.longitude = "22.9375";
        window.zoom = "5";
      }
    </script>
    <script type="text/javascript" src="https://www.vesselfinder.com/aismap.js"></script>
  </div>
</body>
</html>
